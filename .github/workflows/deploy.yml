name: CI/CD - Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to remote VM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create access.pem from secret
        run: |
          printf '%s\n' "${{ secrets.ACCESS_PEM }}" > access.pem
          chmod 600 access.pem

      - name: SSH to server and deploy
        env:
          PEM: access.pem
        run: |
          ssh -i "$PEM" -o StrictHostKeyChecking=no azureuser@135.237.121.55 << 'EOF'
            set -euo pipefail
            cd Luxe-watches-ecommerce || exit 1
            git pull
            # stop/delete any existing pm2 process named "index" (avoid failing if it doesn't exist)
            pm2 stop index || true
            pm2 delete index || true
            # start the app and name the process "index"
            pm2 start index.js --name index
            pm2 save
          EOF

      - name: Remove local pem
        if: always()
        run: |
          shred -u access.pem || rm -f access.pem || true
