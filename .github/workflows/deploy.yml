name: CI/CD - Deploy to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to remote VM
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create SSH private key from secret
        run: |
          printf '%s\n' "${{ secrets.SSH_ACCESS_KEY }}" > ssh_key
          chmod 600 ssh_key

      - name: SSH to server and deploy
        env:
          SSH_KEY: ssh_key
        run: |
          ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no sudheerkumarv117@34.132.119.152 << 'EOF'
            set -euo pipefail

            # If directory exists → pull
            # If not → clone the repo
            if [ -d "Luxe-watches-ecommerce" ]; then
              echo "Directory exists — pulling latest changes..."
              cd Luxe-watches-ecommerce
              git pull || true
            else
              echo "Directory not found — cloning repository..."
              git clone https://github.com/abhilashvalappil/Luxe-watches-ecommerce.git
              cd Luxe-watches-ecommerce
            fi

            # Stop/delete old pm2 process
            pm2 stop index || true
            pm2 delete index || true

            # Start the app
            pm2 start index.js --name index
            pm2 save
          EOF

      - name: Remove SSH key
        if: always()
        run: |
          shred -u ssh_key || rm -f ssh_key || true
